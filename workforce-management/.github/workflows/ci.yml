name: Continuous Integration & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed MongoDB with Benchmark Data
        env:
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DATABASE: hr_automation
          ENVIRONMENT: test
        run: |
          python database/seed_database.py
          python database/validate_database.py

      - name: Run Backend Pytest Suite
        env:
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DATABASE: hr_automation
          ENVIRONMENT: test
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-long-2026
        run: |
          python -m pytest tests/ -v --durations=10

  frontend-test:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Verify TypeScript & Production Build
        working-directory: ./frontend
        run: npm run build
