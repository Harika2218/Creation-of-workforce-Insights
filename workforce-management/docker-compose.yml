# ===================================================================
# AI-Powered Workforce Management Automation System
# Production / Staging Multi-Container Orchestration (Docker Compose)
# ===================================================================
# Usage:
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f backend
#   docker compose down
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. MongoDB Document Store
  # -----------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hr_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hr_automation
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hr_network

  # -----------------------------------------------------------------
  # 2. FastAPI Backend Core & AI Inference
  # -----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ENVIRONMENT=staging
      - PROJECT_NAME=AI Workforce Management Automation System
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DATABASE=hr_automation
      - MONGODB_MAX_POOL_SIZE=50
      - MONGODB_MIN_POOL_SIZE=10
      - JWT_SECRET=compose-jwt-secret-key-change-in-production-2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_AUTH_PER_MINUTE=10
      - RATE_LIMIT_AI_PER_MINUTE=30
      - RATE_LIMIT_GENERAL_PER_MINUTE=120
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
      - ALLOWED_HOSTS=*
      - NOTIFICATIONS_ENABLED=true
      - REALTIME_NOTIFICATIONS_ENABLED=true
      - SCHEDULER_INTERVAL_SECONDS=60
      - EMAIL_ENABLED=false
      - EMAIL_PROVIDER=mock
      - METRICS_ENABLED=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hr_network

  # -----------------------------------------------------------------
  # 3. React 19 Frontend + Nginx Reverse Proxy
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hr_network

networks:
  hr_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
