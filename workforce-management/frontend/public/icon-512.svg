<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="brandGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(99, 102, 241, 0.35)" stroke-width="4"/>
  
  <!-- Central Emblem / Monogram -->
  <g transform="translate(128, 128)" filter="url(#glow512)">
    <!-- Stylized H / Human Pulse -->
    <path d="M42 42 L42 214 M42 128 L214 128 M214 42 L214 214" stroke="url(#brandGrad512)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Workforce Node Orb -->
    <circle cx="128" cy="128" r="22" fill="#38BDF8"/>
    <circle cx="42" cy="42" r="14" fill="#8B5CF6"/>
    <circle cx="214" cy="42" r="14" fill="#6366F1"/>
    <circle cx="42" cy="214" r="14" fill="#38BDF8"/>
    <circle cx="214" cy="214" r="14" fill="#8B5CF6"/>
  </g>
</svg>
