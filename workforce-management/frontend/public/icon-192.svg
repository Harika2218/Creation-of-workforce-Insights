<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>
  
  <!-- Central Emblem / Monogram -->
  <g transform="translate(48, 48)" filter="url(#glow)">
    <!-- Stylized H / Human Pulse -->
    <path d="M16 16 L16 80 M16 48 L80 48 M80 16 L80 80" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Workforce Node Orb -->
    <circle cx="48" cy="48" r="8" fill="#38BDF8"/>
    <circle cx="16" cy="16" r="5" fill="#8B5CF6"/>
    <circle cx="80" cy="16" r="5" fill="#6366F1"/>
    <circle cx="16" cy="80" r="5" fill="#38BDF8"/>
    <circle cx="80" cy="80" r="5" fill="#8B5CF6"/>
  </g>
</svg>
